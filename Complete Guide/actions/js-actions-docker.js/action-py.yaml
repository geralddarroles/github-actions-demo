name: "Deploy to AWS S3"
description: "Deploys a folder to an AWS S3 bucket"
runs: 
  using: "docker"
  image: "Dockerfile"
inputs:
    bucket:
        description: "The name of the S3 bucket to deploy to"
        required: true
    bucker-region:
        description: "The region of the S3 bucket"
        required: true
        default: "us-east-1"
    dist-folder:
        description: "The folder containing the static website files to deploy"
        required: true
        default: "dist"
outputs:
      website-url: 
        description: The URL of the deployed website 