name: "Deploy to AWS S3"
description: "Deploy a static website via AWS S3"
inputs:
    bucket:
        description: "The name of the S3 bucket to deploy to"
        required: true
    bucker-region:
        description: "The region of the S3 bucket"
        required: true
        default: "us-east-1"
    dist-folder:
        description: "The folder containing the static website files to deploy"
        required: true
        default: "dist"
outputs:
      website-url: 
        description: The URL of the deployed website 
# there is no value output for js actions 


runs: 
    using: "Node 16"
    main: "main.js"
    