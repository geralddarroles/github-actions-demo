name: Deploy website
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
# caching dependencies    
      - name: Cache node modules 
        uses: actions/cache@v3
        with: 
          path: ~/.npm 
          key: node_modules_${{hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Cache node modules 
        uses: actions/cache@v3
        with: 
          path: ~/.npm 
          key: node_modules_${{hashFiles('**/package-lock.json') }}
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
        # uploading artifcats to be used in the deploy job 
      - name: upload build artifacts 
        uses: actions/upload-artifact@v4
        with:
          name: dist-files 
          path: dist 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name:  Get build artificats 
        uses: actions/download-artifact@v4
        with:
          name: dist-files 
      - name : Output contents
        run: ls 
      - name: Deploy 
        run: echo "Deploying website..."
     
