name: Test Project
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4 # grabs the data

      - name: Setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  deploy: 
    needs: test # ensure that the test job is completed before running the deploy job  
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4 # grabs the data

      - name: Setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name:  Build project
        run:  npm run build 
      - name: Deploy project 
        run: "echo deploying project" 
