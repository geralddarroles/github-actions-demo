name: Deployment lint
on: push
jobs: 
    deploy-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v4 # grabs the data  

            - name: Setup nodejs
              uses: actions/setup-node@v3
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run linter
              run: npm run lint    
            - name: Run tests
              run: npm test
            - name: Build project
              run: npm run build 
            - name: Deploy project 
              run: "echo deploying project" 


